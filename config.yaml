server:
  host: "127.0.0.1"
  port: 8080

role:
  name: "server_manager"
  #the name value for role can only be server_manager OR server OR devices
  host: "127.0.0.1"
  port: 8081
  #the port and host value and is what you had set for role:host and role:port for the server_manager

manager:
  name: "PC Manager"
  refreshInterval: 30000
  #all devices need to have the same refresh rate 

services:
  devices:
    enabled: true
    name: "Devices"

  home:
    enabled: true
    name: "Processus"

  network:
    enabled: true
    name: "Réseau"

  storage:
    enabled: true
    name: "Stockage"

  apps:
    enabled: true
    name: "Applications"